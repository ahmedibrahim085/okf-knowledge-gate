name: okf-check
description: >-
  Check an Open Knowledge Format (OKF) bundle: spec conformance, house rules, staleness, and
  human-verification claims. Runs the same okf-check as the Claude Code plugin, so the verdict is the same.
inputs:
  bundle:
    description: Path of the bundle folder to check.
    required: true
  strict-trust:
    description: >-
      'true' makes unauthenticated human verification and near-miss actors (Human:dana) fail the job.
    required: false
    default: 'false'
  fail-stale:
    description: "'true' makes stale concepts fail the job (exit 4)."
    required: false
    default: 'false'
  require-house-rules:
    description: >-
      'true' fails the job (exit 3) when a house-rule layer was skipped: L2 profile (okflint is not installed on the
      runner, or the bundle has no okf-base.yaml) or L2 index (no index.md, an index.md that declares no counts, or no
      python3). Without it a skipped layer is only a warning.
    required: false
    default: 'false'
  args:
    description: >-
      Extra options for okf-check, separated by spaces. Only options that keep the full gate run are accepted:
      --strict-trust, --fail-stale, --json and --fail-on-change. Every other flag is refused (exit 64), because a mode
      such as --duplicates or --file replaces the gate run with a report that exits 0. Use report-args for reports.
    required: false
    default: ''
  report-args:
    description: >-
      Report modes to run after the gate, separated by spaces: --duplicates, --duplicates-body, --facts [NAME] and
      --conserve REF. The report is printed in the log and never changes the job's exit code (a failed report run
      gives a ::warning::).
    required: false
    default: ''
  verify:
    description: >-
      'true' also runs okf-verify on the bundle after okf-check, and checks that the commits, paths and line citations
      its notes cite exist. Citations to commits need the history: check out with 'fetch-depth: 0'. The job takes
      okf-check's exit code, or okf-verify's when okf-check passed.
    required: false
    default: 'false'
  repo:
    description: Folder of the repository okf-verify looks cited commits up in (its --repo). Used only with verify. This and any --repo in verify-args are the only repositories searched; okf_check.verify.repos in okf-base.yaml is not (since 0.9.50).
    required: false
    default: '.'
  verify-args:
    description: >-
      Extra arguments for okf-verify, separated by spaces (for example '--strict --since origin/main'). Used only with
      verify. --help, --version and --check-config are refused.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      # Inputs reach the script through env, never interpolated into it (GitHub secure-use guidance).
      # GITHUB_ACTION_PATH is set from github.action_path, as the composite-action docs show.
      env:
        INPUT_BUNDLE: ${{ inputs.bundle }}
        INPUT_STRICT_TRUST: ${{ inputs.strict-trust }}
        INPUT_FAIL_STALE: ${{ inputs.fail-stale }}
        INPUT_REQUIRE_HOUSE_RULES: ${{ inputs.require-house-rules }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_REPORT_ARGS: ${{ inputs.report-args }}
        INPUT_VERIFY: ${{ inputs.verify }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_VERIFY_ARGS: ${{ inputs.verify-args }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        INPUT_REQUIRE_HOUSE_RULES=${INPUT_REQUIRE_HOUSE_RULES:-false}
        INPUT_VERIFY=${INPUT_VERIFY:-false}
        INPUT_REPO=${INPUT_REPO:-.}
        for pair in "strict-trust=$INPUT_STRICT_TRUST" "fail-stale=$INPUT_FAIL_STALE" "require-house-rules=$INPUT_REQUIRE_HOUSE_RULES" "verify=$INPUT_VERIFY"; do
          case "${pair#*=}" in
            true|false) ;;
            # The value is not echoed back: it is untrusted text, and a newline in it would start a second workflow command.
            *) echo "::error::input ${pair%%=*} must be 'true' or 'false'"; exit 64 ;;
          esac
        done
        if [ -z "$INPUT_BUNDLE" ]; then
          echo "::error::input 'bundle' is required: the path of the bundle folder"; exit 64
        fi
        # A value that starts with "-" would reach okf-check as a flag (--doctor and --help exit 0: a green job
        # that checked nothing). The value is not echoed back: it is untrusted text in a workflow command.
        case "$INPUT_BUNDLE" in
          -*) echo "::error::input 'bundle' must be a folder path, not a flag"; exit 64 ;;
        esac
        # args and verify-args: words split on spaces into an array (read -a does not expand globs), passed to the tool as
        # separate arguments, never through a shell. A flag that exits 0 without checking the bundle is refused, for the
        # reason the bundle value is guarded above. Values are not echoed back (untrusted text in a workflow command).
        case "$INPUT_REPO$INPUT_ARGS$INPUT_REPORT_ARGS$INPUT_VERIFY_ARGS" in
          *$'\n'*) echo "::error::inputs repo, args, report-args and verify-args must be one line"; exit 64 ;;
        esac
        case "$INPUT_REPO" in
          -*) echo "::error::input 'repo' must be a folder path, not a flag"; exit 64 ;;
        esac
        read -r -a extra <<< "$INPUT_ARGS"
        read -r -a vextra <<< "$INPUT_VERIFY_ARGS"
        read -r -a rextra <<< "$INPUT_REPORT_ARGS"
        # args is an allow-list: every mode flag of okf-check (--doctor, --duplicates, --facts, --conserve, --file ...)
        # replaces the gate run with another output that exits 0, and would switch the gate off in silence.
        for a in ${extra[@]+"${extra[@]}"}; do
          case "$a" in
            --strict-trust|--fail-stale|--json|--fail-on-change) ;;
            *) echo "::error::input 'args' accepts only --strict-trust, --fail-stale, --json and --fail-on-change (reports go in report-args)"; exit 64 ;;
          esac
        done
        # report-args: report modes only, each run after the gate; a value (a fact name, a ref) must not look like a flag.
        r_mode=0
        for a in ${rextra[@]+"${rextra[@]}"}; do
          case "$a" in
            --duplicates|--duplicates-body|--facts|--conserve) r_mode=1 ;;
            -*) echo "::error::input 'report-args' accepts only --duplicates, --duplicates-body, --facts and --conserve with their values"; exit 64 ;;
          esac
        done
        if [ "${#rextra[@]}" -gt 0 ] && [ "$r_mode" -eq 0 ]; then
          echo "::error::input 'report-args' needs one of --duplicates, --duplicates-body, --facts, --conserve"; exit 64
        fi
        for a in ${vextra[@]+"${vextra[@]}"}; do
          case "$a" in
            --help|-h|--version|--check-config)
              echo "::error::input 'verify-args' holds a flag that ends the run without verifying the bundle"; exit 64 ;;
          esac
        done
        args=()
        if [ "$INPUT_STRICT_TRUST" = true ]; then args+=(--strict-trust); fi
        if [ "$INPUT_FAIL_STALE" = true ]; then args+=(--fail-stale); fi
        args+=(${extra[@]+"${extra[@]}"})
        # okf-check's own exit code is the job's exit code: 0 pass, 1 L1/trust, 2 could not run, 3 house rules, 4 stale.
        # The log is kept so the job can say, with a ::warning::, when exit 0 means less than "everything was checked".
        # Three temp files hold the job's own output: the merged log the checks read, and the two streams kept apart. A
        # temp folder that is not writable would stop the step under `set -e` with mktemp's own message and no
        # annotation, so it is named here, and the files go on every exit path (they hold bundle content).
        if ! log=$(mktemp) || ! out=$(mktemp) || ! err=$(mktemp); then
          echo "::error::the runner's temp folder (TMPDIR) is not writable, so okf-check cannot report and the job must not pass"
          exit 2
        fi
        trap 'rm -f "$log" "$out" "$err"' EXIT
        # --json prints one JSON document instead of the text report, so the enforcement below reads the fact from
        # whichever report the tool printed. A job's verdict must not depend on the output format. The two streams are
        # captured apart and then printed together: the JSON document is what stdout holds, and a line on stderr (an
        # okflint or Python warning) is not part of it and must not be able to break the parse.
        json_out=0
        for a in ${extra[@]+"${extra[@]}"}; do [ "$a" = --json ] && json_out=1; done
        py=""
        [ "$json_out" -eq 1 ] && command -v python3 >/dev/null 2>&1 && py=python3
        # One parse of the --json document answers every question below: the concept count and, for each layer, whether
        # it was skipped, could not run, or ran. It reads skipped[] and layers_not_run[] and never searches the document
        # — a note name or a link target inside it is untrusted text. Each answer is one fixed word, so nothing from the
        # report reaches a workflow command; "error<TAB>why" says the document cannot be read.
        facts_parser='import json,sys
        try:
            doc = json.load(open(sys.argv[1], encoding="utf-8", errors="replace"))
        except Exception:
            print("error\tthe output is not one JSON document"); sys.exit(3)
        if not isinstance(doc, dict):
            print("error\tthe report is not a JSON object"); sys.exit(3)
        skipped = doc.get("skipped")
        notrun = doc.get("layers_not_run")
        if not isinstance(skipped, list):
            print("error\tthe report has no skipped list"); sys.exit(3)
        if not isinstance(notrun, list):
            print("error\tthe report has no layers_not_run list"); sys.exit(3)
        concepts = doc.get("concepts")
        print("concepts\t%s" % ("0" if concepts == 0 and not isinstance(concepts, bool) else "other"))
        for layer in sys.argv[2:]:
            if any(isinstance(x, str) and x == layer for x in notrun):
                print("%s\tnotrun" % layer)
            elif any(isinstance(s, str) and s.startswith(layer + ": ") for s in skipped):
                print("%s\tskipped" % layer)
            else:
                print("%s\tno" % layer)'
        set +e   # the runner starts bash with -e and pipefail: keep going after a failing okf-check so the warnings below print
        "$GITHUB_ACTION_PATH/plugin/scripts/okf-check" "$INPUT_BUNDLE" ${args[@]+"${args[@]}"} >"$out" 2>"$err"
        rc=$?
        cat "$out" "$err" | tee "$log"
        # The per-run facts, once: the concept count and one state per layer. A report that cannot be read leaves them
        # empty and says why; the enforcement below then fails CLOSED, and the warnings stay quiet (a warning decides
        # nothing). The text report answers the same questions from its own anchored lines, without python.
        facts=""; facts_why=""
        if [ "$json_out" -eq 1 ]; then
          if [ -z "$py" ]; then facts_why="python3 is not on PATH"
          elif ! facts=$("$py" -c "$facts_parser" "$out" 'L2 profile' 'L2 index' 'L2 graph'); then
            facts_why=$(awk -F'\t' '$1 == "error" { print $2; exit }' <<<"$facts"); facts=""
          fi
        fi
        fact() { [ -n "$facts" ] && awk -F'\t' -v k="$1" '$1 == k { print $2; exit }' <<<"$facts"; }
        # A parser that prints something else — a shim, or a broken interpreter that still exits 0 — is not an answer:
        # every row this run asks for must be there, or the report counts as unreadable and the enforcement fails CLOSED.
        if [ -n "$facts" ]; then
          for k in concepts 'L2 profile' 'L2 index' 'L2 graph'; do
            [ -n "$(fact "$k")" ] || { facts_why="the parser gave no table row for $k"; facts=""; break; }
          done
        fi
        # Fixed messages only: a note name can spell "L1 conformance PASS 0 concepts", so the text line is anchored to the
        # report's own shape (two leading spaces; findings are indented 19) and the JSON answer is the parsed count.
        zero=0
        if [ "$json_out" -eq 1 ]; then [ "$(fact concepts)" = 0 ] && zero=1
        elif grep -Eq '^  L1 conformance +PASS +0 concepts' "$log"; then zero=1; fi
        if [ "$zero" -eq 1 ]; then
          echo "::warning::okf-check found 0 concepts, so nothing was checked. Is the 'bundle' path right?"
        fi
        # Every layer okf-check can skip from the command line gets its own warning, in both report styles. L2 graph also
        # has a COULD NOT RUN path that still exits 0 (okf-memory answered nothing readable): the job passes, so it is
        # warned about too, in its own words. L3 derived is not here: its skip cannot be reached from the command line
        # (with no python the run stops earlier and the JSON carries no skipped list), so listing it would be an
        # unpinned name; L3 staleness prints COULD NOT RUN and fails the job, never SKIPPED.
        for layer in 'L2 profile' 'L2 index' 'L2 graph'; do
          if [ "$json_out" -eq 1 ]; then state=$(fact "$layer"); else
            state=no
            grep -Eq "^  $layer +SKIPPED( —|$)" "$log" && state=skipped
            grep -Eq "^  $layer +COULD NOT RUN" "$log" && state=notrun
          fi
          case "$state" in
            skipped) echo "::warning::okf-check skipped a layer ($layer): it is not a pass. See the log above for the reason." ;;
            notrun)  echo "::warning::okf-check could not run a layer ($layer): it is not a pass. See the log above for the reason." ;;
          esac
        done
        # The enforcement fails CLOSED: a report that cannot be read means a skipped layer cannot be ruled out.
        enforce_skipped() {
          if [ "$json_out" -ne 1 ]; then grep -Eq "^  $1 +SKIPPED( —|$)" "$log"; return; fi
          [ -n "$facts" ] || { echo "::error::okf-check --json did not give one readable report (${facts_why:-no detail}), so a skipped layer cannot be ruled out"; return 0; }
          [ "$(fact "$1")" = skipped ]
        }
        # The house-rule layers are L2 profile (okflint + okf-base.yaml) and L2 index (the declared counts). Either one
        # skipped means the house rules were not checked, so require-house-rules fails the job for both. The other layers
        # that can be skipped (L2 graph, L3 derived) are not house rules: L2 graph is warned about above, L3 derived is
        # out of that list because its skip cannot be reached from the command line, and neither fails the job.
        if [ "$INPUT_REQUIRE_HOUSE_RULES" = true ] && [ "$rc" -eq 0 ] \
           && { enforce_skipped 'L2 profile' || enforce_skipped 'L2 index'; }; then
          echo "::error::house rules were required but a house-rule layer was skipped (L2 profile: okflint missing or no okf-base.yaml; L2 index: no index.md, an index.md that declares no counts, or no python3)"
          rc=3
        fi
        rm -f "$log" "$out" "$err"
        # verify: okf-verify always runs when asked, so one failing tool does not hide the other. The job takes okf-check's
        # exit code, or okf-verify's when okf-check passed.
        # report-args: each report mode runs on its own, after the gate. Their exit code never decides the job (a bad ref in
        # --conserve gets a warning).
        run_report() {
          "$GITHUB_ACTION_PATH/plugin/scripts/okf-check" "$INPUT_BUNDLE" "$@"
          rrc=$?
          if [ "$rrc" -ne 0 ]; then
            echo "::warning::a report run (report-args) exited $rrc; it does not change the result of the job."
          fi
        }
        grp=()
        for a in ${rextra[@]+"${rextra[@]}"}; do
          case "$a" in
            --duplicates|--duplicates-body|--facts|--conserve)
              if [ "${#grp[@]}" -gt 0 ]; then run_report "${grp[@]}"; fi
              grp=("$a") ;;
            *) grp+=("$a") ;;
          esac
        done
        if [ "${#grp[@]}" -gt 0 ]; then run_report "${grp[@]}"; fi
        if [ "$INPUT_VERIFY" = true ]; then
          "$GITHUB_ACTION_PATH/plugin/scripts/okf-verify" "$INPUT_BUNDLE" --repo "$INPUT_REPO" ${vextra[@]+"${vextra[@]}"}
          vrc=$?
          if [ "$rc" -eq 0 ]; then rc=$vrc; fi
        fi
        exit "$rc"
