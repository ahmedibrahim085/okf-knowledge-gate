# CI: the release suites on GitHub's Linux runner, and the repository's own Action on a valid and an invalid bundle.
# The file ships in the public export too (.github ships whole). The GitHub-hosted jobs run only when the repository is
# public: Actions minutes are billed for private repositories, so in the private one they show as skipped, never as passed.
# In the private one the selfhosted job runs the same suites on the owner's own runner instead.
# run-suites.sh reads tools/linux-gate.conf when the tree has it and otherwise uses the defaults below.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    # The README claims GNU awk and mawk on Linux. The release gate runs gawk (Debian 12); this runs both.
    name: Suites on Linux (${{ matrix.awk }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        awk: [gawk, mawk]
    env:
      # Defaults for the public tree. The private tree takes its values from tools/linux-gate.conf, and
      # tools/ci-workflow.test.sh fails when these differ from that file.
      OKF_LINUX_PYTHON: "3.12"
      OKF_LINUX_UV: "0.11.28"
      OKF_LINUX_PRECOMMIT: "4.7.0"
      OKF_LINUX_MARKDOWN_IT: "3.0.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versions from tools/linux-gate.conf (private tree only)
        run: |
          [ -f tools/linux-gate.conf ] || { echo "no tools/linux-gate.conf: the defaults of this workflow apply"; exit 0; }
          for k in OKF_LINUX_PYTHON OKF_LINUX_UV OKF_LINUX_PRECOMMIT OKF_LINUX_MARKDOWN_IT; do
            v=$(sed -n "s/^$k=//p" tools/linux-gate.conf)
            if [ -n "$v" ]; then echo "$k=$v" >> "$GITHUB_ENV"; fi
          done

      - name: ${{ matrix.awk }} as awk, and the pinned okflint, pre-commit and markdown-it-py in a uv venv
        env:
          AWK_IMPL: ${{ matrix.awk }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gawk mawk jq procps > /dev/null
          mkdir -p "$HOME/awk-bin" && ln -sf "/usr/bin/$AWK_IMPL" "$HOME/awk-bin/awk"
          echo "$HOME/awk-bin" >> "$GITHUB_PATH"
          .github/ci/install-uv.sh "$OKF_LINUX_UV"
          export PATH="$HOME/.local/bin:$PATH"
          uv venv -q --python "$OKF_LINUX_PYTHON" "$HOME/venv"
          . "$HOME/venv/bin/activate"
          # The supported okflint: the pinned source if the pin file names one, else the pinned release (0.5.1 carries
          # every fix this gate needs).
          pins=plugin/config/pinned-versions.txt
          okflint=$(awk '$1=="okflint_source"{print $2}' "$pins")
          [ -n "$okflint" ] || okflint="okflint==$(awk '$1=="okflint"{print $2}' "$pins")"
          uv pip install -q "$okflint" "pre-commit==$OKF_LINUX_PRECOMMIT" "markdown-it-py==$OKF_LINUX_MARKDOWN_IT"
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$HOME/venv" >> "$GITHUB_ENV"

      - name: Suites and --selftest
        run: .github/ci/run-suites.sh

  selfhosted:
    # The private repository's own runner (one runner, one job at a time; its minutes cost nothing). Its container is
    # recreated, so gawk and uv are installed in the job every time. The versions come from tools/linux-gate.conf and
    # plugin/config/pinned-versions.txt, never from this file. The guard names the owner, not the repository: the public
    # export renames the repository, and a job guarded by its name would then wait for ever in the public one, which has
    # no self-hosted runner.
    name: Suites on the self-hosted runner (gawk)
    # A pull request from a fork never runs here: its code would run on the owner's machine (GitHub's hardening guide for
    # self-hosted runners).
    if: ${{ github.event.repository.private && github.repository_owner == 'ahmedibrahim085' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versions from tools/linux-gate.conf; the venv and caches under RUNNER_TEMP
        run: |
          for k in OKF_LINUX_PYTHON OKF_LINUX_UV OKF_LINUX_PRECOMMIT OKF_LINUX_MARKDOWN_IT; do
            v=$(sed -n "s/^$k=//p" tools/linux-gate.conf)
            [ -n "$v" ] || { echo "::error::$k is not set in tools/linux-gate.conf"; exit 1; }
            echo "$k=$v" >> "$GITHUB_ENV"
          done
          # The runner is not ephemeral: its work folder and caches survive between jobs. Everything this job makes lives
          # under RUNNER_TEMP or the workspace, which the last step empties (uv itself stays in ~/.local/bin, pinned).
          echo "OKF_VENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/uv-python" >> "$GITHUB_ENV"   # a Python uv downloads when the runner has none
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"

      - name: gawk as awk (the runner has mawk only)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gawk > /dev/null
          mkdir -p "$RUNNER_TEMP/awk-bin" && ln -sf "$(command -v gawk)" "$RUNNER_TEMP/awk-bin/awk"
          echo "$RUNNER_TEMP/awk-bin" >> "$GITHUB_PATH"

      - name: The pinned uv, okflint, pre-commit and markdown-it-py in a venv, as the runner's own user
        run: |
          .github/ci/install-uv.sh "$OKF_LINUX_UV"
          export PATH="$HOME/.local/bin:$PATH"
          uv venv -q --clear --python "$OKF_LINUX_PYTHON" "$OKF_VENV"
          . "$OKF_VENV/bin/activate"
          pins=plugin/config/pinned-versions.txt
          okflint=$(awk '$1=="okflint_source"{print $2}' "$pins")
          [ -n "$okflint" ] || okflint="okflint==$(awk '$1=="okflint"{print $2}' "$pins")"
          uv pip install -q "$okflint" "pre-commit==$OKF_LINUX_PRECOMMIT" "markdown-it-py==$OKF_LINUX_MARKDOWN_IT"
          echo "$OKF_VENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$OKF_VENV" >> "$GITHUB_ENV"

      - name: Suites and --selftest
        run: .github/ci/run-suites.sh

      - name: Leave nothing behind (the runner is not ephemeral)
        if: always()
        run: |
          # :? stops the step when a path is empty, so find never starts from another folder. A test may leave a folder
          # without write permission: give the owner write access back first, or -delete cannot empty it.
          chmod -R u+rwX "${GITHUB_WORKSPACE:?}" "${RUNNER_TEMP:?}" 2>/dev/null || true
          find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
          find "${RUNNER_TEMP:?}" -mindepth 1 -delete

  action:
    name: The Action on itself
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Two bundles, one valid and one with an L1 error (no type)
        run: |
          for b in good bad; do
            mkdir -p "$RUNNER_TEMP/$b"
            printf -- '---\nokf_version: "0.2"\n---\n# Notes\n' > "$RUNNER_TEMP/$b/index.md"
            printf -- '# Log\n\n## 2026-01-01\n* created\n' > "$RUNNER_TEMP/$b/log.md"
          done
          printf -- '---\ntype: Lesson\ntitle: Payment limits\ndescription: Limits for payouts.\nstatus: stable\nstale_after: "2099-01-01"\n---\n\nbody\n' > "$RUNNER_TEMP/good/limits.md"
          printf -- '---\ntitle: Payment limits\ndescription: Limits for payouts.\nstatus: stable\nstale_after: "2099-01-01"\n---\n\nbody\n' > "$RUNNER_TEMP/bad/limits.md"

      - name: A valid bundle passes
        uses: ./
        with:
          bundle: ${{ runner.temp }}/good

      - name: A bundle with an L1 error fails the step
        id: bad
        continue-on-error: true
        uses: ./
        with:
          bundle: ${{ runner.temp }}/bad

      - name: require-house-rules without okflint fails the step
        id: house
        continue-on-error: true
        uses: ./
        with:
          bundle: ${{ runner.temp }}/good
          require-house-rules: 'true'

      # verify, repo, verify-args and report-args. The note cites the commit this job checked out. With
      # verify-args --strict an UNRESOLVED commit fails okf-verify: the commit is in this checkout (repo '.') and in no
      # commit of an empty repository, so the two steps below differ only by the repository okf-verify searched.
      - name: A bundle whose note cites the checked-out commit, and an empty repository
        run: |
          mkdir -p "$RUNNER_TEMP/cites"
          cp "$RUNNER_TEMP/good/index.md" "$RUNNER_TEMP/good/log.md" "$RUNNER_TEMP/cites/"
          printf -- '---\ntype: Lesson\ntitle: Payment limits\ndescription: Limits for payouts.\nstatus: stable\nstale_after: "2099-01-01"\n---\n\nFixed in commit %s.\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/cites/limits.md"
          git init -q "$RUNNER_TEMP/empty-repo"

      - name: verify with --strict finds the cited commit in this repository
        uses: ./
        with:
          bundle: ${{ runner.temp }}/cites
          verify: 'true'
          verify-args: '--strict'
          report-args: '--duplicates'

      - name: verify with --strict and a repository without the commit fails the step
        id: wrongrepo
        continue-on-error: true
        uses: ./
        with:
          bundle: ${{ runner.temp }}/cites
          verify: 'true'
          repo: ${{ runner.temp }}/empty-repo
          verify-args: '--strict'

      - name: report-args with a flag that is not a report fails the step
        id: report
        continue-on-error: true
        uses: ./
        with:
          bundle: ${{ runner.temp }}/good
          report-args: '--doctor'

      - name: The failing steps failed
        env:
          BAD: ${{ steps.bad.outcome }}
          HOUSE: ${{ steps.house.outcome }}
          WRONGREPO: ${{ steps.wrongrepo.outcome }}
          REPORT: ${{ steps.report.outcome }}
        run: |
          [ "$BAD" = failure ] || { echo "::error::the Action passed a bundle with an L1 error (outcome: $BAD)"; exit 1; }
          [ "$HOUSE" = failure ] || { echo "::error::require-house-rules passed although L2 was skipped (outcome: $HOUSE)"; exit 1; }
          [ "$WRONGREPO" = failure ] || { echo "::error::verify --strict passed a commit the given repo does not hold (outcome: $WRONGREPO)"; exit 1; }
          [ "$REPORT" = failure ] || { echo "::error::report-args accepted a flag that is not a report (outcome: $REPORT)"; exit 1; }
          echo "the Action failed every step it had to fail"
